  materials:
    filler: BLACK_STAINED_GLASS_PANE
    back: OAK_DOOR
    close: BARRIER
    previous-page: ARROW
    next-page: ARROW
    # rent menu
    rent-info: PAPER
    rent-accept: LIME_CONCRETE
    rent-confirm: YELLOW_CONCRETE
    rent-cancel: RED_CONCRETE
    # owner menu
    owner-trades: WRITABLE_BOOK
    owner-storage: CHEST
    owner-upgrades: NETHER_STAR
    owner-rent: CLOCK
    owner-sale: GOLDEN_CARROT
    owner-featured: NETHER_STAR
    owner-staff: PLAYER_HEAD
    owner-customize: VILLAGER_SPAWN_EGG
    owner-stats: BOOK
    owner-cancel: BARRIER
    owner-cancel-confirm: TNT
    # upgrades
    upgrade-slots: BARREL
    upgrade-tax: GOLD_INGOT
    upgrade-duration: CLOCK
    # trade editor
    trade-payment1: YELLOW_STAINED_GLASS_PANE
    trade-payment2: ORANGE_STAINED_GLASS_PANE
    trade-result: LIME_STAINED_GLASS_PANE
    trade-locked: BARRIER
    trade-unused: GRAY_STAINED_GLASS_PANE
    trade-page: PAPER
    trade-upgrades: NETHER_STAR
    # sales menu
    sale-info: GOLDEN_CARROT
    sale-percent: GOLD_INGOT
    sale-duration: CLOCK
    sale-stop: RED_CONCRETE
    sale-start: LIME_CONCRETE
    sale-blocked: GRAY_CONCRETE
    sale-listed-on: LIME_DYE
    sale-listed-off: GRAY_DYE
