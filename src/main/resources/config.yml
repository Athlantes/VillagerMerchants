# VillagerMerchants configuration
#
# All player-facing TEXT (menus, messages, item names, lore) is in lang/<language>.yml.
# Colors/names of name tag presets, categories and effects are in nametags.yml, categories.yml and effects.yml.
# /vm reload applies changes (settings marked [restart] are read once at startup).

language: en               # lang/<language>.yml - copy lang/en.yml to add your own translation

# ── Permissions ─────────────────────────────────────────────────────────────────
# Every feature is a normal permission node, so LuckPerms (or any permissions plugin) controls it. The full
# list is in PERMISSIONS.md. Out of the box nothing changes for existing servers: core features are open to
# everybody and you take things away. Flip this to start locked instead:
permissions:
  strict: false            # true = core features (rent, /shops, teleport, sales, upgrades, customization ...) are
                           # OP-only until you grant them, e.g.  /lp group default permission set villagermerchants.rent true
                           # (applied on /vm reload)

autosave-seconds: 30       # [restart]

defaults:
  unlocked-slots: 3        # trade slots every new player starts with

rent:
  price: 5000.0            # price for 'base-days' of rent
  base-days: 7
  grace-hours: 48          # owner can still renew / empty storage after expiry
  max-shops-per-player: 1  # for players with no rank node. More per rank: villagermerchants.maxshops.<n> (highest wins),
                           # or villagermerchants.maxshops.unlimited. Set this to your LOWEST rank's limit.
  cancel-refund: 0.5       # fraction of the remaining rent value refunded on cancel
  expiry-check-seconds: 60 # [restart] how often expired rentals are checked

# PlaceholderAPI: %vm_active_shops%, %vm_total_sales%, %vm_rent_status% ... (full list on the plugin page / README)
placeholders:
  enabled: true            # [restart] register the %vm_...% expansion when PlaceholderAPI is installed
  refresh-seconds: 5       # how often shop counts are recomputed (applied by /vm reload)
  expiring-hours: 24       # %vm_rent_status% turns "expiring" when a rental has less than this left
  status:                  # text of %vm_rent_status%; & colour codes work
    active: "&aActive"
    expiring: "&eExpiring"
    expired: "&cExpired"
    none: "&7None"

# Daily / weekly leaderboards: top earners, best-rated and most-visited shops. See /shops top.
# Shops are ranked by their owner. Staff and the owner never count as visitors; each player counts once per period.
leaderboards:
  enabled: true
  size: 10                 # entries kept per board (also the most /shops top <board> shows)
  chat-lines: 5            # entries per board in plain /shops top
  refresh-seconds: 30      # how often the boards (and %vm_top_...% placeholders) are recalculated
  timezone: ""             # e.g. "Europe/Bucharest". Empty = the server's timezone
  reset-time: "00:00"      # HH:mm when a new day / week starts
  weekly-reset-day: MONDAY # MONDAY ... SUNDAY
  min-ratings: 3           # a shop needs this many ratings given during the period to enter the rated board
  announce: true           # broadcast the winners of each board when a period resets
  placeholder-empty: "-"   # %vm_top_...% text for ranks nobody holds yet
  periods:
    daily: true
    weekly: true
  # Rewards, paid to the owner of the shop at that rank when a period resets. Both parts are optional.
  # Commands run as console; %player% %uuid% %rank% %value% %period% %board% are replaced. Commands run even if the
  # winner is offline, so use ones that work for offline players (e.g. a permissions or economy command).
  # Layout: rewards.<daily|weekly>.<earners|rated|visited>.<rank>
  rewards: {}
  #  daily:
  #    earners:
  #      1:
  #        money: 1000
  #        commands:
  #          - "give %player% diamond 2"
  #      2:
  #        money: 500
  #      3:
  #        money: 250
  #  weekly:
  #    visited:
  #      1:
  #        money: 2500
  #    rated:
  #      1:
  #        money: 2500

# cost of next level = base-cost * multiplier ^ currentLevel
upgrades:
  slots:
    max-level: 24
    base-cost: 10000.0
    multiplier: 1.35
    per-level: 1           # extra trade slots per level
  tax:
    max-level: 5
    base-cost: 25000.0
    multiplier: 1.8
    per-level: 0.05        # rent discount per level (5% each)
  duration:
    max-level: 4
    base-cost: 15000.0
    multiplier: 1.6
    per-level: 7           # extra max days of rent per level

skins:                     # permanent unlocks
  type-price: 15000.0
  profession-price: 25000.0
  free: [plains, none]     # skin ids everybody owns from the start
  # Lock single skins behind a permission node of your choice (works even when require-permission is off).
  # An empty string "" keeps a skin open even when customization.require-permission.skins is on.
  # permissions:
  #   librarian: "villagermerchants.vip"
  #   jungle: "myserver.rank.donor"
  # Optional price for one specific skin (overrides type-price / profession-price):
  # prices:
  #   jungle: 20000.0
  #   librarian: 40000.0
  # Icons in the customization menu (any item material). Names are in the language file.
  icons:
    plains: GRASS_BLOCK
    desert: SAND
    jungle: JUNGLE_LOG
    savanna: ACACIA_LOG
    snow: SNOW_BLOCK
    swamp: LILY_PAD
    taiga: SPRUCE_LOG
    none: EMERALD
    armorer: BLAST_FURNACE
    butcher: SMOKER
    cartographer: CARTOGRAPHY_TABLE
    cleric: BREWING_STAND
    farmer: COMPOSTER
    fisherman: BARREL
    fletcher: FLETCHING_TABLE
    leatherworker: CAULDRON
    librarian: LECTERN
    mason: STONECUTTER
    shepherd: LOOM
    toolsmith: SMITHING_TABLE
    weaponsmith: GRINDSTONE

npc:
  look-at-players: true
  look-radius: 6.0
  look-update-ticks: 4

nametag:                   # the floating text above shop NPCs
  height: 0.3              # blocks above the default position
  shadowed: true
  see-through: false
  animation-ticks: 4       # [restart] update speed of animated tags (<anim_rainbow>)

commands:
  look-range: 6.0          # how far /vm remove, /vm sale and /vm staff look for the shop NPC you're facing
  look-accuracy: 0.9       # 1.0 = must look dead-center, lower = more forgiving

prompts:
  timeout-seconds: 60      # chat prompts (price, search, add staff) cancel themselves after this long

trading:
  shift-click-max: 64      # how many times shift-clicking a trade buys it at once

custom-items:
  # ItemsAdder / Oraxen / MMOItems: treat copies of the same custom item as one product, even when their
  # rolled stats or durability differ. Each item is still stored and handed over with its own exact data.
  # false = strict matching (isSimilar) for everything.
  match-by-id: true

money:
  enabled: true                 # allow money-priced trades (shift-left-click "Payment 1" in the trade editor)
  token-material: EMERALD       # item shown as the price inside the trading UI (display only, never given out)
  min-price: 0.01
  max-price: 1000000000
  shorthand:                    # suffixes accepted when typing a price: 1.5k, 2m, ...
    k: 1000
    m: 1000000
    b: 1000000000

# ── Anti-abuse ──────────────────────────────────────────────────────────────────
# Rules that keep shops from being used to launder items or money. Trades that break a rule can't be saved in the
# editor, and trades that already exist (saved before a rule changed) stay in the shop but are LOCKED for customers.
# /vm reload applies changes. Texts are under "anti-abuse:" in the language file.
anti-abuse:
  enabled: true

  blacklist:
    creative-only: true         # built-in list of items you can't get in survival (bedrock, command blocks, barriers,
                                # spawners, spawn eggs, infested blocks, debug stick, ...)
    # Extra banned items. Material names, case-insensitive. '*' is a wildcard:  "*_SHULKER_BOX", "NETHERITE_*"
    materials: []
    # materials: [TNT, "*_SHULKER_BOX", ENCHANTED_GOLDEN_APPLE]
    # ItemsAdder / Oraxen / MMOItems ids (the same id format used in the transaction log), case-insensitive
    custom-items: []

  # Highest price for ONE unit of the item being sold. A trade selling 16 of an item may cost up to 16 x the cap.
  # 0 = no cap. Applies to money-priced trades; item-for-item trades have no price to cap.
  max-unit-price:
    default: 0
    # Per item (material name or custom-item id). A value of 0 means "no cap for this item".
    overrides: {}
    # overrides:
    #   DIAMOND: 2000
    #   NETHERITE_INGOT: 25000
    #   ELYTRA: 0

  # Trade-spam protection. Players with villagermerchants.bypass.tradecooldown are exempt.
  cooldown:
    purchase-ms: 750            # minimum time between a player's purchase clicks (0 = off)
    max-purchases: 30           # purchase clicks allowed per window (0 = off)
    window-seconds: 10

  # What goes into suspicious.log, the console, and the /vm suspicious list.
  suspicious:
    log-file: suspicious.log    # inside plugins/VillagerMerchants/ (plain file name only)
    console: true               # also print to the server console
    alert-staff: true           # tell online players with villagermerchants.alerts
    memory-entries: 200         # how many recent entries /vm suspicious can show
    throttle-seconds: 5         # drop repeats of the same noisy event (blocked clicks, rate limit) from one player
    high-value: 1000000         # one purchase paying at least this much is logged (0 = off)
    repeat-pair:                # the same buyer purchasing from the same shop owner over and over (wash trading)
      count: 15                 # purchases (clicks) ...
      window-minutes: 60        # ... within this time (count 0 = off)
    same-ip: true               # buyer and shop owner online from the same IP. A lead, not proof: families and
                                # shared networks trigger it too.

# ── Region and claim protection ─────────────────────────────────────────────────
# Where shops may be placed and rented, and who may do it. Checked when an admin runs /vm create and when a player
# rents a shop NPC (before they are charged); the NPC's location is what is checked. Every rule you turn on must
# pass. Shops that already exist are not touched when you change rules. /vm reload applies changes, and
# /vm protection shows what is enforced and what the rules say about the spot you are standing on.
# Players with villagermerchants.bypass.protection skip all of it (not given to ops by default).
protection:
  enabled: true
  on-error: deny                # what to do when a check can't be completed (a hook threw, or Lands' API isn't
                                # recognised): deny = refuse, allow = let it through
  apply-to-admin-create: true   # false = only the rent check runs; /vm create is unrestricted

  worldguard:
    enabled: true
    # Shops are only allowed inside one of these regions. Empty = any region (or none) is fine.
    # Use "world:region" to tie a region name to one world.
    allowed-regions: []
    # allowed-regions: [market, "world_nether:bazaar"]
    # The custom region flag "vm-shops" (registered by this plugin):
    #   off     = ignore the flag
    #   require = shops only where a region sets it:   /rg flag market vm-shops allow
    #   block   = shops everywhere except where set:   /rg flag spawn vm-shops deny
    flag: "off"            # quoted on purpose: a bare off is read as false by YAML
    # The player placing / renting must be allowed to build at that spot (region owner/member, bypass permission).
    require-build: false

  # GriefPrevention and Lands share the same options (keep "off" in quotes):
  #   mode: off            - ignore this plugin
  #         deny-claimed   - no shops inside any claim
  #         require-trust  - inside a claim the player needs build trust there; elsewhere see allow-unclaimed
  griefprevention:
    mode: "off"
    allow-unclaimed: true       # false = the spot must be inside a claim
    allow-admin-claims: true    # GriefPrevention admin claims (spawn, markets) always pass
  lands:
    mode: "off"
    allow-unclaimed: true

notifications:
  enabled: true
  chat: true
  actionbar: true
  sound: "entity.experience_orb.pickup"   # '' to disable
  join-summary: true            # "while you were away" recap for sellers
  join-max-lines: 5             # recent sales listed in the recap
  join-delay-ticks: 60
  # The message texts are in the language file (notify.sale-money / notify.sale-item).

log:
  retention-days: 0             # 0 = keep the transaction log forever
  page-size: 8                  # rows per page in /vm sales, /vm purchases and /vm log
  time-format: "MM-dd HH:mm"    # Java DateTimeFormatter pattern for the log
  stats-days: 7                 # window of the "recent" numbers in the owner menu

directory:
  hide-empty-shops: true        # only list shops that have at least one live offer
  # categories are defined in categories.yml; /shops search <item> finds shops by what they sell
  show-coordinates: false
  min-rating-options: [3.0, 4.0, 4.5]   # steps of the rating filter ("any" is always first)
  matching-offers-shown: 3      # offers listed per shop while searching
  categories-shown: 4           # "Sells:" categories listed per shop
  items-shown: 3                # "Items:" listed per shop
  teleport:
    enabled: true
    cost: 0.0                   # charged to the player, not paid to anyone
    cooldown-seconds: 60
    warmup-seconds: 3           # cancelled if the player moves
    move-tolerance: 0.7         # blocks the player may drift during the warm-up
    # Blocks the landing spot must not be on / next to (material names)
    unsafe-floor: [MAGMA_BLOCK, CACTUS, CAMPFIRE, SOUL_CAMPFIRE, LAVA]
    unsafe-air: [FIRE, SOUL_FIRE, SWEET_BERRY_BUSH, WITHER_ROSE, POWDER_SNOW, COBWEB, LAVA]

ratings:
  enabled: true
  require-purchase: true        # must have bought from the shop to rate it
  prompt-after-purchase: true   # clickable stars in chat after closing the shop
  prompt-cooldown-minutes: 30
  show-on-nametag: true
  ranking:                      # "Top rated" sorting: a lone 5-star vote shouldn't beat a proven 4.8 shop
    prior-weight: 3.0           # how many "average" votes every shop starts with
    prior-mean: 3.5             # what those votes are worth

customization:
  skins-enabled: true
  nametags-enabled: true
  effects-enabled: true       # particle effects tab (configured in effects.yml)
  # Per-item permission gating. When a switch is on, EVERY item of that kind needs its own node
  # (free skins excepted), so you give players the ones you want, e.g. to a VIP group:
  #   /lp group vip permission set villagermerchants.skin.librarian true
  #   /lp group vip permission set villagermerchants.skin.*  true         <- all skins
  # Single items can also be locked without these switches: a "permission:" line in effects.yml / nametags.yml,
  # or skins.permissions.<skin> above. Locked items still show in the menu, marked as locked.
  require-permission:
    skins: false              # villagermerchants.skin.<id>      (ids: plains, jungle, librarian ...)
    nametags: false           # villagermerchants.nametag.<id>   (ids from nametags.yml)
    effects: false            # villagermerchants.effect.<id>    (ids from effects.yml)
# ── Sales: "20% off for 2 hours" ────────────────────────────────────────────────
# Only money-priced trades are discounted (item-for-item trades have no price to cut).
sales:
  enabled: true
  min-percent: 5
  max-percent: 50
  max-hours: 24
  cooldown-minutes: 30          # wait after a sale ends before starting another (stops permanent "sales")
  fee: 0.0                      # optional fee to start a sale (withdrawn, not paid to anyone)
  percent-options: [10, 20, 30, 40, 50]            # buttons in the sale menu
  duration-options: [30, 60, 120, 360, 720, 1440]  # minutes, buttons in the sale menu
  min-minutes: 5                # shortest sale a player can start
  banner: true                  # extra name tag line while a sale runs (text: sale.banner in the language file)
  banner-refresh-seconds: 60    # how often the countdown on that line updates
  tab-complete-durations: ["30m", "1h", "2h", "6h", "12h", "1d"]   # suggestions for /vm sale start <percent> <time>
  effect: ""                    # effect id from effects.yml that overrides the owner's effect during a sale ('' = off)

# ── Featured listings: owners pay to be pinned at the top of /shops ─────────────
# The fee is withdrawn and not paid to anyone, so it's a pure money sink.
featured:
  enabled: true
  max-slots: 5                  # shops that can be featured at the same time
  max-stack-hours: 72           # can't buy more than this far ahead
  packages:                     # hours: price
    "6": 2500.0
    "24": 8000.0
    "72": 20000.0

# ── Shop staff and co-owners ────────────────────────────────────────────────────
# Roles: STOCKER (storage) < MANAGER (+ trades, sales, stats) < CO_OWNER (+ rent, featured listings).
# Only the owner can cancel the shop, buy upgrades, change the NPC's look or manage staff.
staff:
  enabled: true
  max-per-shop: 5               # for owners with no rank node. More per rank: villagermerchants.maxstaff.<n> / .unlimited
  # What each role may do. Allowed: STORAGE, TRADES, SALES, STATS, BILLING (or ALL).
  # The owner always can do everything; cancelling, upgrades, NPC look and staff stay owner-only.
  roles:
    stocker: [STORAGE]
    manager: [STORAGE, TRADES, SALES, STATS]
    co_owner: [ALL]

promotions:
  tick-seconds: 20              # [restart] how often sales and featured listings are checked

# ── Menu icons (any item material). Titles, names and lore are in the language file. ──
