# VillagerMerchants configuration
autosave-seconds: 30

defaults:
  unlocked-slots: 3        # trade slots every new player starts with

rent:
  price: 5000.0            # price for 'base-days' of rent
  base-days: 7
  grace-hours: 48          # owner can still renew / empty storage after expiry
  max-shops-per-player: 3
  cancel-refund: 0.5       # fraction of the remaining rent value refunded on cancel

# cost of next level = base-cost * multiplier ^ currentLevel
upgrades:
  slots:
    max-level: 24
    base-cost: 10000.0
    multiplier: 1.35
    per-level: 1           # extra trade slots per level
  tax:
    max-level: 5
    base-cost: 25000.0
    multiplier: 1.8
    per-level: 0.05        # rent discount per level (5% each)
  duration:
    max-level: 4
    base-cost: 15000.0
    multiplier: 1.6
    per-level: 7           # extra max days of rent per level

skins:                     # permanent unlocks (Plains + Unemployed are free)
  type-price: 15000.0
  profession-price: 25000.0

npc:
  look-at-players: true
  look-radius: 6.0
  look-update-ticks: 4

money:
  enabled: true                 # allow money-priced trades (shift-left-click "Payment 1" in the trade editor)
  token-material: EMERALD       # item shown as the price inside the trading UI (display only, never given out)
  min-price: 0.01
  max-price: 1000000000

notifications:
  enabled: true
  chat: true
  actionbar: true
  sound: "entity.experience_orb.pickup"   # '' to disable
  join-summary: true            # "while you were away" recap for sellers
  join-max-lines: 5             # recent sales listed in the recap
  join-delay-ticks: 60
  # MiniMessage. Placeholders: <buyer> <item> <qty> <price> <paid>
  format:
    money: "<green>[Sale] <white><buyer></white> bought <white><qty>x <item></white> for <gold><price></gold>"
    item: "<green>[Trade] <white><buyer></white> traded <white><paid></white> for <white><qty>x <item></white>"

log:
  retention-days: 0             # 0 = keep the transaction log forever

directory:
  hide-empty-shops: true        # only list shops that have at least one live offer
  # categories are defined in categories.yml; /shops search <item> finds shops by what they sell
  show-coordinates: false
  teleport:
    enabled: true
    cost: 0.0                   # charged to the player, not paid to anyone
    cooldown-seconds: 60
    warmup-seconds: 3           # cancelled if the player moves

ratings:
  enabled: true
  require-purchase: true        # must have bought from the shop to rate it
  prompt-after-purchase: true   # clickable stars in chat after closing the shop
  prompt-cooldown-minutes: 30
  show-on-nametag: true

customization:
  skins-enabled: true
  nametags-enabled: true
  effects-enabled: true       # particle effects tab (configured in effects.yml)
# ── Sales: "20% off for 2 hours" ────────────────────────────────────────────────
# Only money-priced trades are discounted (item-for-item trades have no price to cut).
sales:
  enabled: true
  min-percent: 5
  max-percent: 50
  max-hours: 24
  cooldown-minutes: 30          # wait after a sale ends before starting another (stops permanent "sales")
  fee: 0.0                      # optional fee to start a sale (withdrawn, not paid to anyone)
  percent-options: [10, 20, 30, 40, 50]            # buttons in the sale menu
  duration-options: [30, 60, 120, 360, 720, 1440]  # minutes, buttons in the sale menu
  banner: true                  # extra name tag line while a sale runs
  banner-format: "<red><bold>ON SALE</bold> <yellow>-<percent>%</yellow> <gray>(<time>)</gray>"
  effect: ""                    # effect id from effects.yml that overrides the owner's effect during a sale ('' = off)

# ── Featured listings: owners pay to be pinned at the top of /shops ─────────────
# The fee is withdrawn and not paid to anyone, so it's a pure money sink.
featured:
  enabled: true
  max-slots: 5                  # shops that can be featured at the same time
  max-stack-hours: 72           # can't buy more than this far ahead
  packages:                     # hours: price
    "6": 2500.0
    "24": 8000.0
    "72": 20000.0

# ── Shop staff and co-owners ────────────────────────────────────────────────────
# Roles: STOCKER (storage) < MANAGER (+ trades, sales, stats) < CO_OWNER (+ rent, featured listings).
# Only the owner can cancel the shop, buy upgrades, change the NPC's look or manage staff.
staff:
  enabled: true
  max-per-shop: 5
