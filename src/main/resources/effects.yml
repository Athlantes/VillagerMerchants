# ═══════════════════════════════════════════════════════════════════════════════════
#  VillagerMerchants - shop effects (animated particles around the villager)
#  Appears as the "Effects" tab in the shop customization menu.  /vm reload applies edits.
#  Test any effect on a shop NPC you are looking at:  /vm effect test <id> [seconds]
# ═══════════════════════════════════════════════════════════════════════════════════
#
#  An EFFECT is a name/price/icon plus one or more LAYERS. Every layer is its own particle,
#  shape, animation and colour scheme, and all layers play at the same time.
#
#  effects:
#    my_effect:
#      name: "<gradient:red:gold>My Effect"   # MiniMessage, shown in the menu
#      icon: BLAZE_POWDER                       # any item
#      price: 5000.0                            # 0 = free for everyone
#      permission: ""                           # optional: players need this node to buy/equip
#      enabled: true                            # false hides it without deleting it
#      description: ["Line one", "Line two"]    # shown in the lore (gray)
#      layers:
#        any_name_you_like:
#          ...options below...
#
# ── LAYER OPTIONS (everything is optional; defaults in brackets) ───────────────────
#  shape:      RING CROWN ORBIT HELIX SPIRAL SPHERE CLOUD RAIN RISING PULSE HEART WINGS STAR FOUNTAIN   [RING]
#                RING      circle of `points`                       CROWN    zig-zag crown, `strands` = spikes
#                ORBIT     `strands` orbs circling (+ `trail`)      HELIX    `strands` twisting columns
#                SPIRAL    a glowing head climbing a helix (+trail) SPHERE   hollow ball of `points`
#                CLOUD     random aura (radius x height)            RAIN     falling columns, `period` ticks per fall
#                RISING    like RAIN but upward                     PULSE    expanding rings, `strands` = waves
#                HEART     heart outline, faces the NPC             WINGS    flapping butterfly wings behind the NPC
#                STAR      5-point star outline                     FOUNTAIN `strands` arcs of droplets
#  particle:   any Bukkit/Minecraft particle name (FLAME, end_rod, dust, minecraft:heart ...)   [END_ROD]
#  count:      particles spawned per point                          [1]
#  offset:     [x, y, z] random spread per point. With count: 0 it is a direction instead   [0,0,0]
#  speed:      the particle's "extra"  (velocity / spread, depends on particle)   [0]
#  points:     points per shape (per strand for HELIX/FOUNTAIN)     [16]
#  interval:   ticks between emissions (20 ticks = 1s). Higher = cheaper.   [2]
#  radius / height:  size in blocks   [0.8 / 2.0]
#  y:          height above the NPC's feet   [0]
#  strands:    arms/orbs/spikes/waves, meaning depends on shape
#  turns:      full twists over the height (HELIX, SPIRAL)   [2]
#  taper:      HELIX/SPIRAL radius change with height. 0.5 = narrows, -2 = widens into a tornado   [0]
#  trail:      extra points trailing behind each orb / spiral head   [0]
#  trail-spacing:  ORBIT: degrees between trail points [8]   SPIRAL: fraction of the height [0.02]
#  period:     ticks for one cycle of RAIN/RISING/PULSE/FOUNTAIN/SPIRAL   [40]
#  jitter:     random wobble added to every point (soft, fuzzy look)   [0]
#  chance:     0-1 chance each point actually spawns (sparkle effect)   [1]
#  face:       rotate with the NPC's facing (always on for HEART/WINGS)
#
#  animation:                      (angles in degrees, speeds per tick)
#    spin: 8              rotation around the vertical axis (negative = other way)
#    phase: 0             starting rotation offset in degrees (e.g. 180 = opposite side)
#    tilt-x / tilt-z: 0   tilt the whole shape
#    tumble: 0            keeps rotating the tilt (orbits that roll)
#    bob-amplitude: 0.1   move up and down by this many blocks   (bob-speed: 6)
#    pulse-amplitude: 0.2 radius breathes by +-20%               (pulse-speed: 6)
#    flap-amplitude: 25   WINGS only: how far they fold          (flap-speed: 10)
#
#  colour (particles that take a colour: dust, dust_color_transition, entity_effect, note):
#    size: 1.0              dust size
#    color: "#FFAA00"       QUOTE hex colours ("#" starts a YAML comment!). "255,170,0" also works
#    colors: ["#FF0000", "#0000FF"]
#    to-color: "#000000"    dust_color_transition target (default: next entry of `colors`)
#    color-mode: STATIC     STATIC one colour | CYCLE jump through colors | GRADIENT fade through colors
#                           RAINBOW every hue | RANDOM random entry (or hue)
#    color-speed: 1.0       1.0 = one full colour loop every 5 s (negative reverses)
#    color-spread: 0        0-1: offsets the colour along the shape (rainbow rings etc.). Costs a bit more CPU
#  material: STONE          block/item for block, falling_dust, block_marker, item particles
#
#  SIZE GUIDE: a villager is ~0.6 wide and ~1.95 tall. Keep radius <= 0.7 (feet/ground effects up to 0.9)
#  and top of effect <= ~2.7 so the villager stays visible. Prefer few points + higher interval.
#
#  PERFORMANCE: cost ~ (points x 20 / interval) x players nearby, per shop. Effects nobody is near cost nothing.
# ═══════════════════════════════════════════════════════════════════════════════════

settings:
  view-distance: 24            # only players this close are sent particles (max 64)
  update-ticks: 1              # engine tick rate; 1 = smoothest, 2 = half the CPU
  max-points-per-emission: 200 # hard safety cap per layer per emission
  y-offset: 0.0                # raise/lower every effect
  preview-seconds: 8           # right-click preview / /vm effect test length

