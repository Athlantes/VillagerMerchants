# ═══════════════════════════════════════════════════════════════════════════════
#  VillagerMerchants - English language file
# ═══════════════════════════════════════════════════════════════════════════════
#  * Every player-facing text of the plugin lives here, written in MiniMessage:
#    https://docs.advntr.dev/minimessage/format.html
#  * <placeholders> are filled in by the plugin. Keep the ones that appear in a
#    line (you may move or drop them). Unknown tags are shown as plain text.
#  * <prefix> expands to the "prefix" entry below (empty by default).
#  * To translate: copy this file to lang/<code>.yml (e.g. lang/de.yml), edit it and
#    set  language: <code>  in config.yml, then /vm reload. Keys you leave out fall
#    back to this English text.
#  * Entries ending in ".name" / ".lore" are item names / item lore. Lore is a list;
#    use "" for an empty line.
# ═══════════════════════════════════════════════════════════════════════════════

# Put something like "<dark_gray>[<gold>Shops</gold>]</dark_gray> " here to prefix chat messages.
prefix: ""

# ───────────────────────────── generic words ─────────────────────────────
misc:
  nothing: "nothing"
  unknown: "Unknown"
  unknown-short: "?"
  someone: "Someone"
  item: "item"
  none: "none"
  "yes": "<green>yes"
  "no": "<red>no"
  free: "Free"
  players-only: "<prefix><red>Players only."
  no-permission: "<prefix><red>No permission."

time:
  expired: "expired"
  days-hours: "<days>d <hours>h"
  hours-minutes: "<hours>h <minutes>m"
  minutes: "<minutes>m"

money:
  fallback: "$<amount>"        # used only if the economy plugin can't format money

stars:
  filled: "★"
  empty: "☆"
  format: "<yellow><filled><dark_gray><empty>"

economy:
  not-enough: "<prefix><red>You need <amount> for that."
  payment-failed: "<prefix><red>The payment failed."

token:                         # the "price" item shown inside the trading window
  name: "<gold><price>"
  lore:
    - "<gray>Paid straight from your balance."
    - "<dark_gray>Display item - not a real item."

storage:
  title: "<dark_gray>Shop Storage"

# ───────────────────────────── shared menu buttons ─────────────────────────────
gui:
  back:
    name: "<red>Back"
  close:
    name: "<red>Close"
  cancel:
    name: "<red>Cancel"
  confirm:
    name: "<yellow>Click again to confirm"
  previous-page:
    name: "<yellow>Previous page"
  next-page:
    name: "<yellow>Next page"
  previous-page-numbered:
    name: "<yellow>Previous Page"
    lore:
      - "<gray>Page <page> / <pages>"
  next-page-numbered:
    name: "<yellow>Next Page"
    lore:
      - "<gray>Page <page> / <pages>"

# ───────────────────────────── NPC name tags ─────────────────────────────
nametag:
  available: "<green><bold>Available Shop</bold></green>"
  closed: "<gray>Closed Shop</gray>"
  owner-line: "<owner>'s<br>"            # inserted after the first <bold> of the equipped name tag
  preview-owner: "<owner>'s "            # same, in the customization menu preview
  replace-from: "Available Shop"         # text replaced in rented shops' name tags...
  replace-to: "Shop"                     # ...with this
  rating-suffix: " <yellow>★<rating>"
  fallback-format: "<white><bold>Shop</bold></white>"

# ───────────────────────────── renting ─────────────────────────────
shop:
  rent:
    taken: "<prefix><red>This shop was just rented by someone else."
    max-shops: "<prefix><red>You have reached the maximum number of shops (<max>)."
    no-rent-permission: "<prefix><red>You don't have permission to rent shops."
    success: "<prefix><green>Shop rented for <days> days! Right-click it to manage it."
    no-permission: "<prefix><red>You can't pay rent for this shop."
    too-far: "<prefix><red>You can't rent further ahead. Upgrade your max rent duration!"
    extended: "<prefix><green>Rent extended by <days> days."
  released: "<prefix><yellow>Your shop has been released. Use <gold>/vm claim</gold> to retrieve leftover items."
  claim:
    nothing: "<prefix><gray>You have nothing to claim."
    done: "<prefix><green>Claimed <count> items."
  cancelled: "<prefix><green>Shop cancelled."
  cancelled-refund: "<prefix><green>Shop cancelled. Refunded <refund>."

rent-gui:
  title: "<dark_gray>Rent this shop?"
  info:
    name: "<gold>Rent Cost: <cost>"
    lore:
      - "<gray>Duration: <white><days> days"
      - "<gray>Trade slots: <white><slots>"
      - "<gray>Rent discount: <white><discount>%"
  accept:
    name: "<green>Rent Shop"

# ───────────────────────────── upgrades ─────────────────────────────
upgrade:
  title: "<dark_gray>Upgrades"
  maxed: "<prefix><red>That upgrade is already maxed."
  purchased: "<prefix><green>Upgrade purchased!"
  no-permission: "<prefix><red>You don't have access to that upgrade."
  types:
    slots:
      name: "Trade Slots"
      current: "<slots> slots"
      gain: "+<amount> slot"
    tax:
      name: "Rent Discount"
      current: "<percent>% off rent"
      gain: "+<percent>% off"
    duration:
      name: "Max Rent Duration"
      current: "<days> days"
      gain: "+<days> days"
  item:
    locked:
      name: "<red><name> <gray>(locked)"
      lore:
        - "<gray>Not available for your rank."
    maxed:
      name: "<gold><name> <green>(MAX)"
      lore:
        - "<gray>Current: <white><current>"
    confirm:
      name: "<yellow>Click again to confirm"
      lore:
        - "<gray><gain> for <white><cost>"
    buy:
      name: "<gold><name>"
      lore:
        - "<gray>Level: <white><level>/<max>"
        - "<gray>Current: <white><current>"
        - "<gray>Next: <green><gain>"
        - "<gray>Cost: <white><cost>"
        - "<yellow>Click to buy"

